[package]
name = "reflow-oven"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { version = "1.1.0" }
defmt-rtt = { version = "1.2.0" }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "esp32c6", "defmt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-hal = { version = "1.1.1", features = ["esp32c6", "unstable", "defmt"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32c6"] }
heapless = "0.9.3"
pid = "4.0.0"
splines = { version = "5.0.0", default-features = false, features = ["num-traits"] }
