name: branch-protection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-software:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./software
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          target: thumbv8m.main-none-eabihf
          components: clippy
      - run: cargo clippy -- -D warnings

  lint-hardware:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad@sha256:152dc8b93f01c895287e2ffce151dd142ac7e7d1195cdddcc6baf981177f8da2
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
      - run: su - kicad -c "kicad-cli pcb drc --exit-code-violations --severity-error --schematic-parity $GITHUB_WORKSPACE/hardware/Controller/Controller.kicad_pcb"
      # - run: su - kicad -c "kicad-cli pcb drc --exit-code-violations --severity-error --schematic-parity -o /tmp/report $GITHUB_WORKSPACE/hardware/MCP9601-Breakout/MCP9601-Breakout.kicad_pcb && cat /tmp/report"
      # - run: su - kicad -c "kicad-cli pcb drc --severity-error --schematic-parity -o /tmp/report $GITHUB_WORKSPACE/hardware/Controller/Controller.kicad_pcb && cat /tmp/report"

  required-checks:
    runs-on: ubuntu-latest
    needs:
      - lint-software
      # - lint-hardware
    steps:
      - run: echo true
