[package]
name = "reflow-oven"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1" }
defmt-rtt = { version = "1.1.0" }
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0" }

[dependencies.stm32h5xx-hal]
git = "https://github.com/stm32-rs/stm32h5xx-hal"
features = ["stm32h533"]

[dependencies.stm32h5]
git = "https://github.com/stm32-rs/stm32-rs-nightlies"
features = ["stm32h533", "rt", "defmt"]
